      font-weight: 400;

      letter-spacing: 3px;

      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .asm-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 30px;
      color: var(--brown);
      font-weight: 500;
      line-height: 1.25;
      margin-bottom: 12px;
    }
    .asm-subtitle {
      font-size: 14px;
      color: var(--brown-mid);
      line-height: 1.75;
      margin-bottom: 32px;
    }

    .asm-progress {
      display: flex;

      margin-bottom: 36px;

      letter-spacing: 0.5px;

      width: 100%;
      padding: 13px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: 'Manrope', sans-serif;
      font-size: 14px;
      color: var(--brown);
      background: var(--white);
      transition: border-color 0.2s;
      appearance: none;
    }
    .asm-field input:focus,
    .asm-field select:focus {
      outline: none;
      border-color: var(--gold);
    }
    .asm-field input::placeholder { color: #C0A88A; }

      font-size: 14px;

      font-weight: 400;
      text-align: left;

      line-height: 1.45;

    .asm-option.selected { border-color: var(--brown); background: var(--cream-mid); font-weight: 500; }

    .asm-radio {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--brown);

    }
  </style>
</head>

        html += `<div class="asm-prog-dot ${cls}"></div>`;

          document.getElementById('next-btn').disabled = false;
        }
      }
    }

    function startQuiz() {
      const nome = document.getElementById('f-nome').value.trim();
      const wpp = document.getElementById('f-wpp').value.trim();
      const ig = document.getElementById('f-ig').value.trim();
      const seg = document.getElementById('f-seg').value;
      if (!nome || !wpp || !ig || !seg) {
        alert('Por favor, preencha todos os campos para continuar.');
        return;
      }
      userData = { nome, wpp, ig, seg };
      step = 1;
      showStep(step);
    }

    function selectOpt(el, idx) {
      document.querySelectorAll('.asm-option').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      answers[step - 1] = idx;
      document.getElementById('next-btn').disabled = false;
    }

    function nextStep() {
      if (answers[step - 1] === undefined) return;
      step++;
      if (step > questions.length) showResult();
      else showStep(step);
    }

    function buildTextContent(p, profileKey) {
      const labels = { parado: 'Perfil Parado', perdido: 'Perfil Perdido', travado: 'Perfil Travado' };
      let txt = `DIAGNÓSTICO DO INSTAGRAM\nASM Marketing Digital\n`;
      txt += `${'='.repeat(40)}\n\n`;
      txt += `Perfil: ${labels[profileKey]}\n\n`;
      txt += `${p.title}\n\n${p.desc}\n\n`;
      txt += `O QUE ESTÁ ACONTECENDO:\n`;
      p.items.forEach(item => { txt += `* ${item}\n`; });
      txt += `\nPOR QUE AGIR AGORA:\n${p.urgency}\n\n`;
      txt += `POR ONDE COMEÇAR:\n`;
      p.steps.forEach((s, i) => { txt += `${i+1}. ${s.name}\n   ${s.detail}\n\n`; });
      txt += `${'='.repeat(40)}\n`;
      txt += `Quer ajuda para resolver isso?\nWhatsApp: https://wa.me/${WHATSAPP}\nInstagram: @anelitasmassucate\nSite: asmmktdigital.com.br\n`;
      return txt;
    }

    function copyDiagnostico() {
      const p = profiles[currentProfile];
      const txt = buildTextContent(p, currentProfile);
      navigator.clipboard.writeText(txt).then(() => {
        const btn = document.getElementById('btn-copiar');
        btn.textContent = 'Copiado!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copiar diagnóstico'; btn.classList.remove('copied'); }, 2500);
      });
    }

    function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
      const p = profiles[currentProfile];
      const labels = { parado: 'Perfil Parado', perdido: 'Perfil Perdido', travado: 'Perfil Travado' };
      const marg = 20;
      const pw = 210 - marg * 2;
      let y = 20;

      const wrap = (text, maxW) => {
        const words = text.split(' ');
        const lines = [];
        let line = '';
        words.forEach(w => {
          const test = line ? line + ' ' + w : w;
          if (doc.getTextWidth(test) > maxW) { lines.push(line); line = w; }
          else line = test;
        });
        if (line) lines.push(line);
        return lines;
      };

      doc.setFillColor(93, 64, 50);
      doc.rect(0, 0, 210, 28, 'F');
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(16);
      doc.setTextColor(252, 215, 149);
      doc.text('ASM MARKETING DIGITAL', 105, 12, { align: 'center' });
      doc.setFontSize(9);
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(200, 168, 130);
      doc.text('DIAGNÓSTICO DO INSTAGRAM', 105, 20, { align: 'center' });
      y = 38;

      doc.setFillColor(201, 123, 69);
      doc.roundedRect(marg, y, pw, 8, 2, 2, 'F');
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(9);
      doc.setTextColor(255, 255, 255);
      doc.text(labels[currentProfile].toUpperCase(), 105, y + 5.5, { align: 'center' });
      y += 16;

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(13);
      doc.setTextColor(93, 64, 50);
      wrap(p.title, pw).forEach(line => { doc.text(line, marg, y); y += 7; });
      y += 4;

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10);
      doc.setTextColor(80, 60, 50);
      wrap(p.desc, pw).forEach(line => { doc.text(line, marg, y); y += 5.5; });
      y += 6;

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10);
      doc.setTextColor(93, 64, 50);
      doc.text('O QUE ESTÁ ACONTECENDO:', marg, y);
      y += 6;
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9.5);
      p.items.forEach(item => {
        doc.setFillColor(201, 123, 69);
        doc.circle(marg + 2, y - 1.5, 1.2, 'F');
        const lines = wrap(item, pw - 8);
        lines.forEach((line, i) => { doc.text(line, marg + 6, y + (i * 5)); });
        y += lines.length * 5 + 3;
      });
      y += 4;

      doc.setFillColor(255, 248, 234);
      doc.setDrawColor(201, 123, 69);
      doc.setLineWidth(0.8);
      const urgLines = wrap(p.urgency, pw - 12);
      const urgH = urgLines.length * 5 + 12;
      doc.rect(marg, y, pw, urgH, 'FD');
      doc.line(marg, y, marg, y + urgH);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(8);
      doc.setTextColor(201, 123, 69);
      doc.text('POR QUE AGIR AGORA:', marg + 4, y + 6);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      doc.setTextColor(93, 64, 50);
      urgLines.forEach((line, i) => { doc.text(line, marg + 4, y + 12 + i * 5); });
      y += urgH + 8;

      if (y > 230) { doc.addPage(); y = 20; }
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(11);
      doc.setTextColor(93, 64, 50);
      doc.text('POR ONDE COMEÇAR AGORA', marg, y);
      y += 8;

      p.steps.forEach((s, i) => {
        if (y > 255) { doc.addPage(); y = 20; }
        doc.setFillColor(93, 64, 50);
        doc.circle(marg + 4, y - 1, 4, 'F');
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(9);
        doc.setTextColor(252, 215, 149);
        doc.text(String(i + 1), marg + 4, y + 0.5, { align: 'center' });
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(10);
        doc.setTextColor(93, 64, 50);
        doc.text(s.name, marg + 12, y);
        y += 6;
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9);
        doc.setTextColor(100, 80, 60);
        wrap(s.detail, pw - 12).forEach(line => { doc.text(line, marg + 12, y); y += 5; });
        y += 5;
      });

      doc.setFillColor(93, 64, 50);
      doc.rect(0, 280, 210, 17, 'F');
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8);
      doc.setTextColor(200, 168, 130);
      doc.text('ASM Marketing Digital  |  @anelitasmassucate  |  asmmktdigital.com.br', 105, 290, { align: 'center' });

      doc.save('diagnostico-instagram-asm.pdf');
    }

    function showResult() {
      currentProfile = calcProfile();
      const p = profiles[currentProfile];
      sendLeadEmail(currentProfile, p);

      const msg = encodeURIComponent(`Oi, Anelita! Fiz o diagnóstico do meu Instagram pelo site da ASM e quero resolver isso agora. Meu perfil é ${userData.ig}.`);

      document.getElementById('asm-content').innerHTML = `
        <div class="asm-step-label">Análise concluída</div>
        <div class="asm-result-card">
          <div class="asm-result-badge">${p.badge}</div>
          <div class="asm-result-title">${p.title}</div>
          <div class="asm-result-desc">${p.desc}</div>
          <div class="asm-result-items">${p.items.map(item => `<div class="asm-result-item"><div class="asm-result-item-dot"></div><div class="asm-result-item-text">${item}</div></div>`).join('')}</div>
          <div class="asm-urgency">
            <div class="asm-urgency-title">Por que agir agora?</div>
            <div class="asm-urgency-text">${p.urgency}</div>
          </div>
        </div>
        <div class="asm-cta-block">
          <div class="asm-cta-text">Criamos um checklist para você dar os primeiros passos estratégicos. Me chame agora no WhatsApp para receber.</div>
          <button class="asm-cta-btn" onclick="openWhatsApp('${msg}')">Chamar no WhatsApp</button>
        </div>
      `;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openWhatsApp(msg) {
      window.open(`https://wa.me/${WHATSAPP}?text=${msg}`, '_blank');
    }

    async function sendLeadEmail(profileKey, p) {
      const labels = { parado: 'Perfil Parado', perdido: 'Perfil Perdido', travado: 'Perfil Travado' };
      const services = { parado: 'Análise de Perfil + Social Media (base)', perdido: 'Criação de Estratégia Mensal ou Pack de Conteúdo', travado: 'Social Media com Roteiro de Stories' };

      const answersRows = answers.map((a, i) => `
        <tr style="background:${i % 2 === 0 ? '#FFF8EA' : '#ffffff'}">
          <td style="padding:10px 14px;color:#5D4032;font-weight:600;border:1px solid #D4B896;vertical-align:top;width:50%">${questions[i].q}</td>
          <td style="padding:10px 14px;color:#7A5C4A;border:1px solid #D4B896;vertical-align:top">${questions[i].opts[a]}</td>
        </tr>`).join('');

      const checklistRows = p.steps.map((s, i) => `
        <tr>
          <td style="padding:14px 16px;border-bottom:1px solid #D4B896">
            <table cellpadding="0" cellspacing="0" style="width:100%"><tr>
              <td style="width:32px;vertical-align:top;padding-right:12px">
                <div style="width:28px;height:28px;background:#5D4032;border-radius:50%;color:#FCD795;font-weight:700;font-size:12px;text-align:center;line-height:28px">${i+1}</div>
              </td>
              <td style="vertical-align:top">
                <div style="font-weight:700;color:#3A2018;margin-bottom:4px">${s.name}</div>
                <div style="color:#7A5C4A;font-size:13px;line-height:1.6">${s.detail}</div>
              </td>
            </tr></table>
          </td>
        </tr>`).join('');

      const html = `
        <div style="font-family:Arial,sans-serif;max-width:620px;margin:0 auto;background:#FFF8EA">
          <div style="background:#5D4032;padding:24px;text-align:center">
            <div style="color:#FCD795;font-size:20px;font-weight:700;letter-spacing:3px">ASM MARKETING DIGITAL</div>
            <div style="color:#C8A882;font-size:12px;letter-spacing:2px;margin-top:6px">NOVO LEAD — DIAGNÓSTICO DO INSTAGRAM</div>
          </div>
          <div style="padding:28px 24px">
            <h2 style="color:#3A2018;font-size:16px;margin:0 0 16px">Dados do Cliente</h2>
            <table style="width:100%;border-collapse:collapse;margin-bottom:28px">
              <tr><td style="padding:8px 0;color:#7A5C4A;width:140px"><strong>Nome:</strong></td><td style="color:#3A2018">${userData.nome}</td></tr>
              <tr><td style="padding:8px 0;color:#7A5C4A"><strong>WhatsApp:</strong></td><td style="color:#3A2018">${userData.wpp}</td></tr>
              <tr><td style="padding:8px 0;color:#7A5C4A"><strong>Instagram:</strong></td><td style="color:#3A2018">${userData.ig}</td></tr>
              <tr><td style="padding:8px 0;color:#7A5C4A"><strong>Segmento:</strong></td><td style="color:#3A2018">${userData.seg}</td></tr>
            </table>

            <div style="background:#5D4032;border-radius:10px;padding:16px 20px;margin-bottom:28px">
              <div style="display:inline-block;background:#C97B45;color:#fff;font-size:11px;letter-spacing:2px;padding:4px 12px;border-radius:20px;font-weight:700;margin-bottom:10px">${labels[profileKey].toUpperCase()}</div>
              <div style="color:#FCD795;font-size:15px;font-weight:600;line-height:1.4;margin-bottom:8px">${p.title}</div>
              <div style="color:#C8A882;font-size:13px;line-height:1.6">${p.desc}</div>
            </div>

            <div style="background:#FFF0DC;border-left:3px solid #C97B45;border-radius:4px;padding:14px 16px;margin-bottom:28px">
              <div style="font-size:11px;color:#C97B45;font-weight:700;letter-spacing:2px;margin-bottom:6px">INDICAÇÃO DE SERVIÇO</div>
              <div style="color:#3A2018;font-size:14px">${services[profileKey]}</div>
            </div>

            <h2 style="color:#3A2018;font-size:16px;margin:0 0 12px">Respostas do Questionário</h2>
            <table style="width:100%;border-collapse:collapse;margin-bottom:28px;border:1px solid #D4B896">
              <tr style="background:#5D4032">
                <th style="padding:10px 14px;color:#FCD795;text-align:left;font-size:12px;letter-spacing:1px">PERGUNTA</th>
                <th style="padding:10px 14px;color:#FCD795;text-align:left;font-size:12px;letter-spacing:1px">RESPOSTA</th>
              </tr>
              ${answersRows}
            </table>

            <h2 style="color:#3A2018;font-size:16px;margin:0 0 12px">Checklist — Por onde começar agora</h2>
            <table style="width:100%;border-collapse:collapse;border:1px solid #D4B896;border-radius:8px;overflow:hidden">
              ${checklistRows}
            </table>
          </div>
          <div style="background:#5D4032;padding:16px;text-align:center;font-size:12px;color:#C8A882">
            ASM Marketing Digital &nbsp;|&nbsp; @anelitasmassucate &nbsp;|&nbsp; asmmktdigital.com.br
          </div>
        </div>`;

      try {
        await fetch(`${EMAIL_ENDPOINT}?to=${EMAIL_TO}&token=${EMAIL_TOKEN}`, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            subject: `Novo lead: ${userData.nome} — ${labels[profileKey]}`,
            html: html
          })
        });
      } catch(e) { console.log('email error', e); }
    }

    showStep(0);
  </script>
</body>
</html>
